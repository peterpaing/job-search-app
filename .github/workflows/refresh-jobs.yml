name: Refresh jobs daily

on:
  schedule:
    # Daily at 00:17 UTC / 06:47 Myanmar time.
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    name: Import, verify availability, and clean up jobs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Import jobs into Neon
        id: import
        continue-on-error: true
        run: npm run jobs:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check stored job availability
        run: npx tsx src/scripts/check-jobs.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Delete unreferenced jobs closed over 30 days ago
        run: npm run jobs:cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report import failure
        if: ${{ always() && steps.import.outcome == 'failure' }}
        run: |
          echo "Import failed. Availability checks still ran against stored jobs."
          exit 1