name: Refresh jobs daily

on:
  schedule:
    # Daily at 00:17 UTC / 06:47 Myanmar time.
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    name: Import latest jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Import jobs into Neon
        run: npm run jobs:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}