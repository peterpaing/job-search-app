name: Sync Premium subscriptions

on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-premium-subscriptions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Synchronize Stripe subscriptions
        run: npx tsx src/scripts/sync-billing.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRO_PRICE_ID: ${{ vars.STRIPE_PRO_PRICE_ID }}
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ vars.STRIPE_PORTAL_CONFIGURATION_ID }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          BILLING_MODE: ${{ vars.BILLING_MODE || 'test' }}
          BILLING_LIVE_ENABLED: ${{ vars.BILLING_LIVE_ENABLED || 'false' }}